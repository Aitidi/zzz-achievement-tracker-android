name: Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore release keystore from secret
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/release.keystore" >> $GITHUB_ENV

      - name: Build signed release APK and AAB
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Normalize artifact file name
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/')
          RELEASE_NAME="zzz-achievement-tracker-v${VERSION_NAME}+${VERSION_CODE}-release"
          APK_OUT="${RELEASE_NAME}.apk"
          AAB_OUT="${RELEASE_NAME}.aab"

          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" ! -name "*unsigned*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No signed release APK produced under app/build/outputs/apk/release"
            ls -R app/build/outputs/apk || true
            exit 1
          fi

          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "No signed release AAB produced at $AAB_PATH"
            exit 1
          fi

          cp "$APK_PATH" "$APK_OUT"
          cp "$AAB_PATH" "$AAB_OUT"
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "APK_NAME=$APK_OUT" >> $GITHUB_ENV
          echo "AAB_NAME=$AAB_OUT" >> $GITHUB_ENV

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_NAME"

      - name: Verify AAB signature
        run: jarsigner -verify "$AAB_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.AAB_NAME }}
